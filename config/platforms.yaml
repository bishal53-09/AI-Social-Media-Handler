# Platform integration settings. No API keys: adapters drive the websites through your own
# logged-in browser profile (`asmh login <platform>`). Experimental; see docs/platform-integrations.md.
# "enabled" only controls whether the adapter is offered in the UI.
publishing:
  # Human approval is required before any post can be queued. Do not disable
  # unless you have built your own review step.
  require_approval: true

platforms:
  instagram:
    enabled: true
    api: Browser session (instagram.com)
    handle: ""  # your @handle, used to find a freshly published post
    media:
      reels:
        max_duration_seconds: 900
        min_duration_seconds: 3
        aspect_ratios: ["9:16"]
        max_file_size_mb: 1024
        containers: [mp4, mov]
  tiktok:
    enabled: true
    api: Browser session (tiktok.com)
    handle: ""  # your @handle without the @
    media:
      video:
        max_duration_seconds: 600
        min_duration_seconds: 3
        aspect_ratios: ["9:16", "1:1", "16:9"]
        max_file_size_mb: 4096
        containers: [mp4, mov, webm]
  youtube:
    enabled: true
    api: Browser session (youtube.com)
    media:
      video:
        max_duration_seconds: 43200
        min_duration_seconds: 1
        aspect_ratios: ["16:9", "9:16", "1:1", "4:3"]
        max_file_size_mb: 262144
        containers: [mp4, mov, mkv, webm]
      # Shorts use the same YouTube adapter with Shorts metadata/presets.
      shorts:
        max_duration_seconds: 180
        min_duration_seconds: 1
        aspect_ratios: ["9:16", "1:1"]
        max_file_size_mb: 262144
        containers: [mp4, mov]
  facebook:
    enabled: false
  linkedin:
    enabled: false
  x:
    enabled: false
